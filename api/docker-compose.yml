# MySQL local do Lance a Lance. Sobe com: docker compose up -d  (ou pnpm db:up)
# As senhas vêm do api/.env (o compose lê o .env desta pasta). Só aceita conexões deste computador,
# e só por TLS (require_secure_transport): certificados em db/tls/, gerados por pnpm db:tls.
# Os usuários da API e das migrações não são criados aqui: rode pnpm db:users depois do primeiro db:up.
name: lance-a-lance
services:
  mysql:
    image: mysql:8.4
    container_name: lance-a-lance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?preencha MYSQL_ROOT_PASSWORD no api/.env}
      MYSQL_DATABASE: ${DB_NAME:-lance_a_lance}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server-cert.pem
      - --ssl-key=/etc/mysql/tls/server-key.pem
      - --tls-version=TLSv1.2,TLSv1.3
      - --require-secure-transport=ON
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - lance-a-lance-mysql:/var/lib/mysql
      # só o necessário ao servidor (a chave da CA, db/tls/ca-key.pem, fica fora do container)
      - ./db/tls/ca.pem:/etc/mysql/tls/ca.pem:ro
      - ./db/tls/server-cert.pem:/etc/mysql/tls/server-cert.pem:ro
      - ./db/tls/server-key.pem:/etc/mysql/tls/server-key.pem:ro
    healthcheck:
      # senha por variável de ambiente (MYSQL_PWD), não na linha de comando; TCP usa TLS
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --ssl-mode=REQUIRED --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # API em container (opcional). Só sobe com o perfil "api": pnpm docker:up. Sem o perfil, pnpm db:up sobe só o
  # banco e a API continua rodando no Node da máquina (pnpm start). Imagem: api/Dockerfile, contexto na raiz.
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: lance-a-lance-api:local
    container_name: lance-a-lance-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # só as variáveis que a API lê; a senha do root e a do usuário de migração não entram neste container
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lance_a_lance}
      DB_USER: ${DB_USER:-lance_app}
      DB_PASSWORD: ${DB_PASSWORD:?preencha DB_PASSWORD no api/.env}
      DB_SSL: required
      DB_SSL_CA: db/tls/ca.pem
      JWT_SECRET: ${JWT_SECRET:?preencha JWT_SECRET no api/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-gemini,deepseek,openrouter}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
      AI_QUOTA_COOLDOWN_MIN: ${AI_QUOTA_COOLDOWN_MIN:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_URL: ${GEMINI_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_URL: ${DEEPSEEK_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_URL: ${OPENROUTER_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    volumes:
      # só a CA, para a API verificar o certificado do banco (o nome "mysql" está no certificado)
      - ./db/tls/ca.pem:/app/api/db/tls/ca.pem:ro
    # a análise da pontuação roda um Stockfish por vez (~150 MB); limites para não pesar na máquina
    mem_limit: 768m
    cpus: 1.0

volumes:
  lance-a-lance-mysql:
