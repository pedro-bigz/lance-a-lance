<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Só no "pnpm dev": imita o esqueleto que o artifact e o app desktop põem em volta da página.
     O build (scripts/finalize.mjs) tira este bloco e as duas metas acima. -->
<style data-dev-only>[hidden]{display:none!important}body{margin:0}</style>
<title>Lance a Lance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Symbols+2&display=swap">
<script>
// Antes de desenhar a página: aplica o tema salvo e, no app desktop, trava a área do jogo até o login
(function(){
  try { const t = (JSON.parse(localStorage.getItem('lance-a-lance:prefs:v1') || '{}') || {}).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch(_) {}
  if (window.lanceDesktop && window.lanceDesktop.auth) {
    document.documentElement.classList.add('needs-auth');
    try { if (JSON.parse(localStorage.getItem('lance-a-lance:sidebar:v1') || 'null') === 'recolhida') document.documentElement.classList.add('sb-collapsed'); } catch(_) {}
  }
})();
</script>
</head>
<body>
<!-- A página inteira é a árvore React de src/app/app.tsx (tela de entrada, sidebar, topo, telas, tutor e modais). -->
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
