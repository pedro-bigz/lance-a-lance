name: Desktop

# Gera os instaladores do Lance a Lance em cada sistema, no próprio sistema.
# Dispara em tags vX.Y.Z ou manualmente (Actions → Desktop → Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            ui/pnpm-lock.yaml
      # Interface (ui/): o app empacota ui/dist/lance-a-lance.html, gerado aqui pelo build da ui.
      - name: Instala a interface
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # um comando por passo: no Windows (pwsh) só a falha do último comando de um bloco interromperia o passo
      - name: Tipos da interface
        working-directory: ui
        run: pnpm typecheck
      - name: Lint da interface
        working-directory: ui
        run: pnpm lint
      - name: Testes da interface
        working-directory: ui
        run: pnpm test --maxWorkers=2
      - name: Build da interface
        working-directory: ui
        run: pnpm build
      - run: pnpm install --frozen-lockfile
      - name: Testes do desktop (MIME do app://)
        run: pnpm test
      - name: Garante o binário do Electron
        run: node node_modules/electron/install.js
      # prepare.mjs roda o build da ui de novo (rápido) antes de montar desktop/app/
      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lance-a-lance-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
